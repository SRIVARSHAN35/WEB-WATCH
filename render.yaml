services:
  - type: keyvalue
    name: webwatch-monitoring-queue
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: webwatch-monitoring-api
    runtime: python
    plan: starter
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt && playwright install --with-deps chromium
    startCommand: bash start_render.sh
    healthCheckPath: /healthz/
    disk:
      name: webwatch-sqlite-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: WEBSITE_CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: MONITOR_DEMO_ENABLED
        value: "False"
      - key: DB_ENGINE
        value: django.db.backends.sqlite3
      - key: DB_NAME
        value: /var/data/db.sqlite3
      - key: SQLITE_TIMEOUT
        value: "30"
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: webwatch-monitoring-queue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: webwatch-monitoring-queue
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ALLOWED_ORIGINS_EXTRA
        value: https://webwatch-monitoring-ui.onrender.com

  - type: web
    name: webwatch-monitoring-ui
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://webwatch-monitoring-api.onrender.com/api
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
