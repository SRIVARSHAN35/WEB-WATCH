services:
  - type: web
    name: webwatch
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: npm --prefix frontend ci && VITE_GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" npm --prefix frontend run build && pip install -r backend/requirements.txt && python -m playwright install --with-deps chromium && python backend/manage.py collectstatic --noinput
    startCommand: cd backend && bash start_render.sh
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: WEBSITE_CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: MONITOR_DEMO_ENABLED
        value: "False"
      - key: DB_ENGINE
        value: django.db.backends.mysql
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_SSL_MODE
        value: VERIFY_IDENTITY
      - key: DB_CONNECT_TIMEOUT
        value: "10"
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
